<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ministérios - IP Paranoá</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script type="module" src="/src/styles/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="font-body-md text-on-surface">
    <header id="main-header"></header>

    <main>
        <section class="py-stack-lg bg-surface-container-low">
            <div class="max-w-container-max mx-auto px-margin-mobile md:px-gutter text-center">
                <h1 class="font-headline-xl text-headline-xl text-primary mb-4">Nossos Ministérios</h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                    Conheça as Sociedades Internas e grupos de serviço que compõem a vida comunitária da <span class="church-name"></span>.
                </p>
            </div>
        </section>

        <section class="py-stack-lg">
            <div class="max-w-container-max mx-auto px-margin-mobile md:px-gutter">
                <div id="ministries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-stack-md"></div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
