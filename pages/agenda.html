<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Agenda - IP Paranoá</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script type="module" src="../src/styles/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="font-body-md text-on-surface">
    <header id="main-header"></header>

    <main class="max-w-container-max mx-auto px-margin-mobile md:px-gutter py-stack-lg">
        <div class="mb-stack-lg">
            <h1 class="font-headline-xl text-headline-xl text-primary mb-2">Agenda Completa</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Confira todos os nossos cultos, reuniões e eventos especiais.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
            <!-- Left Column: Quick Info (Calendar) -->
            <div class="lg:col-span-4 space-y-stack-lg">
                <!-- Compact Calendar -->
                <div class="bg-white rounded-xl shadow-sm border border-outline-variant/10 overflow-hidden">
                    <div class="bg-primary p-3 flex justify-between items-center text-on-primary">
                        <button id="prev-month" class="p-1 hover:bg-white/10 rounded-full transition-colors">
                            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
                        </button>
                        <h2 id="calendar-month-year" class="font-label-md text-[14px] uppercase tracking-wider font-bold"></h2>
                        <button id="next-month" class="p-1 hover:bg-white/10 rounded-full transition-colors">
                            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                        </button>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 text-center border-b border-outline-variant/10 bg-surface-container-low font-label-md text-[10px] py-2">
                        <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                    </div>
                    <div id="calendar-days" class="grid grid-cols-7 text-center text-[12px]"></div>
                </div>
            </div>

            <!-- Right Column: Detailed Events List -->
            <div class="lg:col-span-8">
                <h2 class="font-headline-md text-headline-md text-primary mb-6 flex items-center gap-2">
                    <span class="material-symbols-outlined">calendar_month</span> Atividades e Eventos
                </h2>
                <div id="agenda-events" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </main>

    <footer id="main-footer"></footer>
    <script type="module" src="../src/main.js"></script>
</body>
</html>
