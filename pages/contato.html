<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Localização e Contato - IP Paranoá</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script type="module" src="/src/styles/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="font-body-md text-on-surface">
    <header id="main-header"></header>

    <main class="max-w-container-max mx-auto px-margin-mobile md:px-gutter py-stack-lg">
        <header class="mb-stack-lg max-w-2xl">
            <h1 class="font-headline-xl text-headline-xl text-primary mb-stack-sm">Localização e Contato</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Estamos prontos para receber você e sua família.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
            <!-- Map Card (Live Renderer) -->
            <div class="md:col-span-8 h-[400px] bg-surface-container rounded-xl overflow-hidden relative shadow-sm border border-outline-variant/10">
                <iframe 
                    id="map-iframe"
                    width="100%" 
                    height="100%" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm p-4 rounded-lg shadow-md max-w-xs border border-outline-variant/20">
                    <h3 class="font-bold text-primary flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">location_on</span>
                        Endereço
                    </h3>
                    <p id="contact-address" class="text-sm text-on-surface-variant"></p>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="md:col-span-4 flex flex-col gap-gutter">
                <div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-sm border border-outline-variant/10">
                    <h2 class="font-headline-md text-headline-md text-primary mb-4">Secretaria</h2>
                    <ul id="office-hours-list" class="space-y-4"></ul>
                </div>
                <div class="bg-primary text-on-primary p-stack-md rounded-xl shadow-sm">
                    <h2 class="font-headline-md text-headline-md mb-4">Contatos</h2>
                    <div class="space-y-4">
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined">call</span> <span id="contact-phone" class="font-bold"></span></div>
                        <div class="flex items-center gap-2"><span class="material-symbols-outlined">mail</span> <span id="contact-email" class="font-bold"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="main-footer"></footer>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
